    <script>
      // Single Page Application redirect script for static hosts falling back to 404.html
      // Preserves original path, query, and hash parameters without #
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (sessionStorage) {
          sessionStorage.setItem('spa_redirect_path', path + search + hash);
        }
      })();
    </script>
